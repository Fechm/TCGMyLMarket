<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyL Market</title>
  <meta name="description" content="Singles y sellado de Mitos y Leyendas de La Ira frente al mercado chileno">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header id="barra">
    <a class="marca" href="#singles/comparativo"><img src="logo.svg" alt="" width="28" height="28"><span>MyL Market</span></a>
    <button id="abrir-menu" type="button" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">☰</button>
  </header>
  <div id="velo" hidden></div>
  <aside id="menu">
    <a class="marca" href="#singles/comparativo"><img src="logo.svg" alt="" width="36" height="36"><span>MyL Market</span></a>
    <nav aria-label="Vistas">
      <p class="grupo">Singles</p>
      <a href="#singles/comparativo">Comparativo</a>
      <a href="#singles/brechas">Brechas</a>
      <p class="grupo">Sellado</p>
      <a href="#sellado/comparativo">Comparativo</a>
      <a href="#sellado/brechas">Brechas</a>
      <p class="grupo">Diagnóstico</p>
      <a href="#diagnostico/sin-emparejar">Sin emparejar</a>
    </nav>
    <footer id="pie">
      <p id="actualizado"></p>
      <ul id="tiendas"></ul>
      <p>Proyecto independiente, sin afiliación con Mitos y Leyendas.</p>
    </footer>
  </aside>
  <main>
    <header class="encabezado">
      <h1 id="titulo">MyL Market</h1>
      <p id="descripcion" class="sub"></p>
    </header>
    <section id="filtros" hidden>
      <select id="formato" aria-label="Formato">
        <option value="imperio">Imperio</option>
        <option value="pb">Primer Bloque</option>
        <option value="pe">Primera Era</option>
        <option value="fx">Furia Extendido</option>
      </select>
      <select id="edicion" aria-label="Edición"></select>
      <select id="estado" aria-label="Estado">
        <option value="">Todos los estados</option>
        <option value="bajo">Bajo mercado</option>
        <option value="sobre">Sobre mercado</option>
        <option value="en-linea">En línea</option>
        <option value="sin-market">Sin market</option>
      </select>
      <input id="buscar" type="search" placeholder="Buscar carta…" aria-label="Buscar carta">
    </section>
    <p id="resumen"></p>
    <div id="tabla"></div>
  </main>
  <dialog id="detalle">
    <div id="detalle-contenido"></div>
    <form method="dialog"><button>Cerrar</button></form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
